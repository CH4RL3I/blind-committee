[project]
name = "agentfund"
version = "0.1.0"
description = "A multi-agent LLM hedge fund with lookahead defences and an honest evaluation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emilio Gappa", email = "emiliogappa@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "yfinance>=0.2.40",
]

[project.scripts]
agentfund = "agentfund.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
